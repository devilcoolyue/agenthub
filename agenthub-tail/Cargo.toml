[package]
name = "agenthub-tail"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "5"

[profile.release]
lto = "thin"
