name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            plat: darwin-aarch64
          - target: x86_64-apple-darwin
            arch: x64
            plat: darwin-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Build Tauri bundle
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        run: |
          mkdir -p dist-artifacts
          bundle=app/src-tauri/target/${{ matrix.target }}/release/bundle
          find "$bundle/dmg" -name '*.dmg' -exec cp {} dist-artifacts/ \;
          # The updater bundle + signature are named without an arch, so rename
          # them per-platform to avoid collisions when both arches are merged.
          tgz=$(find "$bundle/macos" -name '*.app.tar.gz' | head -1)
          sig=$(find "$bundle/macos" -name '*.app.tar.gz.sig' | head -1)
          cp "$tgz" "dist-artifacts/AgentHub_${{ matrix.plat }}.app.tar.gz"
          cp "$sig" "dist-artifacts/AgentHub_${{ matrix.plat }}.app.tar.gz.sig"
          ls -la dist-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-macos-${{ matrix.arch }}
          path: dist-artifacts/*

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Build Tauri bundle
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # NSIS is Tauri v2's Windows updater target; --bundles nsis keeps the
        # output unambiguous (one installer + one .sig) and skips MSI.
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          bundle=app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          exe=$(find "$bundle" -name '*-setup.exe' | head -1)
          sig=$(find "$bundle" -name '*-setup.exe.sig' | head -1)
          if [ -z "$exe" ] || [ -z "$sig" ]; then
            echo "::error::NSIS installer or signature not found under $bundle"
            ls -laR "app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle" || true
            exit 1
          fi
          # Stable, arch-tagged names so the updater URL in latest.json is
          # predictable. Renaming the .exe does not invalidate its .sig (the
          # signature covers the file contents, not its name).
          cp "$exe" "dist-artifacts/AgentHub_windows-x86_64-setup.exe"
          cp "$sig" "dist-artifacts/AgentHub_windows-x86_64-setup.exe.sig"
          ls -la dist-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-windows-x64
          path: dist-artifacts/*

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \) -exec cp {} release/ \;
          ls -la release

      - name: Generate updater manifest (latest.json)
        run: |
          version="${GITHUB_REF_NAME#v}"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          platforms='{}'
          # add_platform <updater-platform-key> <artifact-filename>
          # The signature file is always "<artifact-filename>.sig".
          add_platform() {
            plat="$1"
            artifact="$2"
            sigfile="release/${artifact}.sig"
            if [ -f "$sigfile" ]; then
              platforms=$(jq -n \
                --argjson acc "$platforms" \
                --arg p "$plat" \
                --arg s "$(cat "$sigfile")" \
                --arg u "${base}/${artifact}" \
                '$acc + {($p): {signature: $s, url: $u}}')
            else
              echo "WARNING: missing signature for $plat ($sigfile); skipping"
            fi
          }
          add_platform darwin-aarch64 "AgentHub_darwin-aarch64.app.tar.gz"
          add_platform darwin-x86_64 "AgentHub_darwin-x86_64.app.tar.gz"
          add_platform windows-x86_64 "AgentHub_windows-x86_64-setup.exe"
          jq -n \
            --arg v "$version" \
            --arg d "$pub_date" \
            --argjson pf "$platforms" \
            '{version: $v, pub_date: $d, platforms: $pf}' > release/latest.json
          cat release/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.app.tar.gz
            release/*-setup.exe
            release/latest.json
          generate_release_notes: true
          draft: false
          prerelease: false
